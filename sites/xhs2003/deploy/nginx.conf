# Nginx 反向代理示例：把 www.example.com 换成你的域名，证书路径换成你的证书。
# 放到 /etc/nginx/conf.d/xhs2003.conf 后执行 nginx -t && systemctl reload nginx

upstream xhs2003 {
    server 127.0.0.1:3003;
    keepalive 16;
}

server {
    listen 80;
    server_name www.example.com example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/nginx/certs/www.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/www.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 图片上传单张上限在后台可调，这里要大于它
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 聊天室实时推送（Server-Sent Events）必须关闭缓冲
    location ~ ^/api/chat/[^/]+/stream$ {
        proxy_pass http://xhs2003;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 上传的图片由 Node 提供，也可以改成 Nginx 直接读数据目录下的 uploads
    location /uploads/ {
        proxy_pass http://xhs2003;
        expires 30d;
    }

    location / {
        proxy_pass http://xhs2003;
        proxy_set_header Connection "";
    }
}
