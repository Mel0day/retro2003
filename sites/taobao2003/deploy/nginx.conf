# 淘宝网 2003 的 Nginx 反向代理示例。证书用 certbot 申请后替换路径。
server {
    listen 80;
    server_name taobao2003.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name taobao2003.example.com;

    ssl_certificate     /etc/letsencrypt/live/taobao2003.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taobao2003.example.com/privkey.pem;

    # 上传宝贝图片：单张 2MB，一次最多 3 张
    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/html;

    location /static/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_cache_valid 200 7d;
        expires 7d;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3004;
        expires 30d;
    }
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
